# Prometheus (Stage H). Started by docker-compose.monitoring.yml; targets resolve on the compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api              # api_*, churn_*, model_version_info
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # node-exporter also serves the drift script's textfile (data_drift_*, model_recall, model_auc):
  # the script writes reports/metrics/*.prom, mounted into node-exporter (see docker-compose.monitoring.yml).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
