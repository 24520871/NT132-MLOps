# Alert rules (Stage H). Evaluated by Prometheus and shown at http://localhost:9090/alerts.
# No Alertmanager yet: notifications (email/Slack) arrive with the automatic-rollback work in Stage I.
groups:
  - name: api
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "API is not reachable by Prometheus"

      - alert: HighErrorRate
        # 5xx only: 4xx (e.g. 422) are the caller's mistakes. Silent when there is no traffic (0/0 = no data).
        expr: |
          sum(rate(api_requests_total{status=~"5.."}[5m]))
            / sum(rate(api_requests_total[5m])) > 0.05
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of API requests fail with 5xx"
          description: "Error ratio over 5m: {{ $value | humanizePercentage }}"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(api_request_duration_seconds_bucket{endpoint="/predict/churn"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency of /predict/churn above 500 ms"
          description: "p95 over 5m: {{ $value | humanizeDuration }}"

  - name: model
    rules:
      - alert: DataDriftDetected
        # data_drift_detected comes from the drift script (simulated replay data unless it runs on real traffic)
        expr: data_drift_detected == 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Data drift detected between reference and recent data"
          description: "Drifted-feature share: {{ with query \"data_drift_share\" }}{{ . | first | value | humanizePercentage }}{{ end }}"
