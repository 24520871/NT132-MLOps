name: churn
model_name: churn            # MLflow registered model name
experiment: churn

data:
  path: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv   # relative to project root
  source: https://www.kaggle.com/datasets/blastchar/telco-customer-churn

split:
  test_size: 0.2
  seed: 42

threshold: 0.5               # probability cutoff for the churn label

models:
  logreg:
    C: 1.0
    max_iter: 1000
  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

gate:
  min_auc: 0.80
  min_recall: 0.60
  max_auc_drop_vs_production: 0.0   # candidate AUC must be >= production AUC - this

# Gate 2 (staging -> production), run on a sample of the held-out test split. Proposed values, not yet confirmed.
staging_gate:
  sample_size: 500
  min_positive_rate: 0.05           # share of rows predicted churn (data has ~26.5 % churners)
  max_positive_rate: 0.70
  max_mean_abs_diff_vs_production: 0.25   # mean |p_staging - p_production| on the same rows
  max_p95_latency_ms: 500           # single-row predict_proba
