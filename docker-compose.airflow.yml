# Airflow overlay (Stage G) on top of the Stage E stack: runs the training DAG instead of `docker compose run trainer`.
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml -f docker-compose.airflow.yml up -d --build
#   -> Airflow UI at http://localhost:8080 (user `admin`, password AIRFLOW_ADMIN_PASSWORD); DAGs start paused: unpause, then trigger.
# Needs in .env (see .env.example): AIRFLOW_DB_PASSWORD, AIRFLOW_ADMIN_PASSWORD, AIRFLOW_SECRET_KEY.
# Airflow's metadata lives in its own Postgres (airflow-db), separate from MLflow's, so an existing `pgdata` volume is untouched.
# Training runs inside this image's own venv (see docker/airflow/Dockerfile), reading ./data and sharing the MLflow artifact volume.
# Memory: webserver + scheduler need about 2 GB on top of the base stack; on EC2 prefer >= t3.xlarge (not deployed yet).
x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: mlops-airflow
  # uid 1000 = the user that owns the shared /mlartifacts volume (mlflow / api images); gid 0 is what Airflow requires
  user: "${AIRFLOW_UID:-1000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
    # Seen by the BashOperator tasks (they inherit the container environment)
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_ARTIFACT_ROOT: /mlartifacts
    API_URL: http://api:8000
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflowlogs:/opt/airflow/logs
    - mlartifacts:/mlartifacts
    - ./data:/app/data:ro

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflowdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: migrates the metadata DB and creates the admin user (the image entrypoint does both from these variables).
  airflow-init:
    <<: *airflow
    command: version
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
      api:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  airflowdb:
  airflowlogs:
