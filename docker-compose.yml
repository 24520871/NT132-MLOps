# Local stack (Stage E): postgres + mlflow + api (+ trainer on demand).
# Secrets come from .env (copy .env.example). Postgres is NOT published to the host.
x-app: &app
  build:
    context: .
    dockerfile: docker/serving/Dockerfile
  image: mlops-app
  environment:
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_ARTIFACT_ROOT: /mlartifacts
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # protects POST /admin/reload; empty = open (fine on localhost)
  volumes:
    - mlartifacts:/mlartifacts

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

  trainer:
    <<: *app
    profiles: ["train"]
    command: sh -c "python -m usecases.churn.train && python -m mlops.registry.promote churn"
    volumes:
      - mlartifacts:/mlartifacts
      - ./data:/app/data:ro
    depends_on:
      - mlflow

volumes:
  pgdata:
  mlartifacts:
